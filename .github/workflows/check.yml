name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate flake
        run: nix flake check --no-build
      - name: Build packages
        run: nix build .#sapcli .#pyodata
      - name: Smoke test sapcli
        run: nix run .#sapcli -- --version
